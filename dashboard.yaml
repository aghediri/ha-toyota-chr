# Toyota C-HR OBD — dashboard (v1.0.0)
# The whole status + history layout is rendered by ONE custom card:
#   custom:chr-dashboard-card  (ships in www/chr-dashboard-card.js)
# Register it as a JavaScript Module resource first (HACS does this
# automatically; manual steps in the README).
title: C-HR
views:
  - title: C-HR
    path: chr
    cards:
      - type: custom:chr-dashboard-card

  # --- Fallback view using only built-in cards (no custom card / no HACS) ---
  - title: C-HR (basic)
    path: chr-basic
    cards:
      - type: glance
        title: Status
        columns: 4
        entities:
          - entity: binary_sensor.toyota_c_hr_in_range
            name: In range
          - entity: sensor.toyota_c_hr_fuel_level
            name: Fuel
          - entity: sensor.toyota_c_hr_hv_battery_soc
            name: HV batt
          - entity: sensor.toyota_c_hr_fault_codes
            name: DTCs
      - type: history-graph
        title: 12V battery (watch for decline)
        hours_to_show: 336
        entities:
          - sensor.toyota_c_hr_12v_battery
      - type: history-graph
        title: Fuel level trend
        hours_to_show: 720
        entities:
          - sensor.toyota_c_hr_fuel_level
