# ESPHome secrets TEMPLATE for the Toyota C-HR OBD bridge.
# Copy into the ESPHome Secrets editor (its own secrets.yaml, separate from
# Home Assistant's secrets.yaml) and fill in the real values.
# DO NOT commit a filled-in copy — only this .example file belongs in git.

