# =============================================================================
#  TOYOTA C-HR  OBD-II  ->  ESP32 BRIDGE  ->  HOME ASSISTANT
#  Flat ESPHome firmware. The ESP32 is a BRIDGE: it speaks ELM327 over BLE to
#  the Vgate dongle, decodes the PIDs, and publishes clean numbers to HA.
#  ALL history / trips / economy / cost / alerts live in HA (see
#  homeassistant/packages/chr_obd.yaml). The ESP32 holds NO logic beyond the
#  per-PID decode formula + the BLE link.
#
#     Toyota C-HR OBD-II port
#           |  (CAN bus)
#           v
#     Vgate iCar Pro 2S   --BLE-->   ESP32 (this firmware)   --WiFi-->   HA
#       (ELM327 reader)              (pure bridge, in the car)       (homeserver)
#
#  The ESP32 lives IN THE CAR and relays over WiFi because the car parks out of
#  the server's Bluetooth range. That's why HA can't do the BLE directly.
# -----------------------------------------------------------------------------
#  >>> DONGLE MAC IS ENTERED FROM HOME ASSISTANT'S UI <<<
#  You do NOT edit the MAC in this YAML. After flashing, go to:
#     HA -> Settings -> Devices -> Toyota C-HR
#       [ OBD Dongle MAC ]  (text box)  -> type/paste the Vgate's BLE MAC
#       [ Reconnect Dongle ] (button)   -> press to apply
#  The MAC is saved in the ESP32's flash and re-applied automatically on boot.
#  Find the MAC with the nRF Connect phone app, then DISCONNECT/forget the
#  dongle on the phone (it allows ONE BLE connection; a lingering phone pairing
#  blocks the ESP32).
# -----------------------------------------------------------------------------
#  ENTITY STANDARD: every entity is sensor.toyota_c_hr_*  (device_name below).
#
#  BEFORE FLASH - only WiFi secrets are needed (ESPHome Secrets editor):
#     wifi_ssid / wifi_password / ap_password / ota_password
#  INSTALL: ESPHome Device Builder -> New device -> ESP32 -> EDIT -> paste this
#    -> Save -> Install (USB first time, OTA after) -> HA auto-discovers.
#  BLE UUIDs: try FFF0/FFF1/FFF2 (set) or 18F0/2AF0/2AF1 if it won't link.
# =============================================================================

substitutions:
  device_name: toyota-c-hr
  friendly_name: "Toyota C-HR"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # On boot, re-apply the MAC saved in flash to the BLE client.
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          std::string m = id(dongle_mac_text).state;
          if (m.length() >= 17) {
            uint8_t a[6];
            if (sscanf(m.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                       &a[0],&a[1],&a[2],&a[3],&a[4],&a[5]) == 6) {
              uint64_t mac = ((uint64_t)a[0]<<40)|((uint64_t)a[1]<<32)|
                             ((uint64_t)a[2]<<24)|((uint64_t)a[3]<<16)|
                             ((uint64_t)a[4]<<8)|((uint64_t)a[5]);
              id(obd_client).set_address(mac);
              ESP_LOGI("chr", "Applied saved dongle MAC: %s", m.c_str());
            }
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

# ---- Globals for connectivity diagnostics -----------------------------------
globals:
  - id: last_data_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

# ---- Persisted storage for the user-entered MAC -----------------------------
preferences:
  flash_write_interval: 1min

# ---- Connectivity -----------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} fallback"
    password: !secret ap_password

logger:

api:
  on_client_connected:
    - lambda: |-
        auto t = id(sntp_time).now();
        if (t.is_valid()) {
          char buf[32];
          t.strftime(buf, sizeof(buf), "%Y-%m-%d %H:%M");
          id(last_synced).publish_state(buf);
        }

ota:
  platform: esphome
  password: !secret ota_password

# ---- Pull the BLE ELM327 custom component from GitHub -----------------------
external_components:
  - source: github://eigger/espcomponents
    components: [ble_elm327]
    refresh: 1d

# ---- BLE link to the dongle -------------------------------------------------
# NOTE: mac_address here is a BOOT PLACEHOLDER only. The real MAC comes from the
# HA UI text field below and is applied via set_address() on boot + on Reconnect.
esp32_ble_tracker:

ble_client:
  - mac_address: "00:00:00:00:00:00"
    id: obd_client

# ---- ELM327 hub -------------------------------------------------------------
# ATSP6 = ISO 15765-4 CAN 11-bit/500k (the Toyota C-HR protocol).
ble_elm327:
  id: obd_elm
  ble_client_id: obd_client
  service_uuid: "FFF0"
  rx_char_uuid: "FFF1"
  tx_char_uuid: "FFF2"
  init_commands:
    - "ATZ"
    - "ATE0"
    - "ATL0"
    - "ATS0"
    - "ATH0"
    - "ATSP6"
  tx_delay: 100

# =============================================================================
#  USER-FACING MAC ENTRY  (this is the "integration UI" the user asked for)
#  A text box + a button, both shown on the device page in Home Assistant.
# =============================================================================
text:
  - platform: template
    name: "OBD Dongle MAC"
    id: dongle_mac_text
    optimistic: true
    mode: text
    restore_value: true          # persisted to flash, survives reboot
    initial_value: ""
    icon: "mdi:bluetooth"
    entity_category: config

button:
  - platform: template
    name: "Reconnect Dongle"
    icon: "mdi:bluetooth-connect"
    entity_category: config
    on_press:
      - lambda: |-
          std::string m = id(dongle_mac_text).state;
          if (m.length() < 17) {
            ESP_LOGW("chr", "MAC too short: '%s'", m.c_str());
            return;
          }
          uint8_t a[6];
          if (sscanf(m.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                     &a[0],&a[1],&a[2],&a[3],&a[4],&a[5]) != 6) {
            ESP_LOGW("chr", "MAC not parseable: '%s'", m.c_str());
            return;
          }
          uint64_t mac = ((uint64_t)a[0]<<40)|((uint64_t)a[1]<<32)|
                         ((uint64_t)a[2]<<24)|((uint64_t)a[3]<<16)|
                         ((uint64_t)a[4]<<8)|((uint64_t)a[5]);
          id(obd_client).set_address(mac);
      - lambda: 'id(obd_client).connect();'
      - logger.log: "Reconnect pressed - applied MAC from HA UI."

# =============================================================================
#  SENSORS  (ble_elm327 API: mode + pid + formula; a,b,c,d = data bytes)
#  The ESP32 DECODES here; HA only displays + derives history.
# =============================================================================
sensor:
  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Engine RPM"
    id: engine_rpm
    mode: "01"
    pid: "0C"
    update_interval: 10s
    formula: "return ((a * 256.0f) + b) / 4.0f;"
    unit_of_measurement: "rpm"
    icon: "mdi:engine"
    state_class: measurement
    filters:
      # Stamp arrival time of real OBD data (feeds Data Fresh / Connection Status).
      - lambda: 'id(last_data_ms) = millis(); return x;'

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Speed"
    mode: "01"
    pid: "0D"
    update_interval: 10s
    formula: "return a;"
    unit_of_measurement: "km/h"
    icon: "mdi:speedometer"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Coolant Temp"
    mode: "01"
    pid: "05"
    update_interval: 30s
    formula: "return a - 40.0f;"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Intake Air Temp"
    mode: "01"
    pid: "0F"
    update_interval: 30s
    formula: "return a - 40.0f;"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Ambient Temp"
    mode: "01"
    pid: "46"
    update_interval: 60s
    formula: "return a - 40.0f;"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Engine Load"
    mode: "01"
    pid: "04"
    update_interval: 10s
    formula: "return a * 100.0f / 255.0f;"
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Throttle"
    mode: "01"
    pid: "11"
    update_interval: 10s
    formula: "return a * 100.0f / 255.0f;"
    unit_of_measurement: "%"
    icon: "mdi:car-cruise-control"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Fuel Level"
    mode: "01"
    pid: "2F"
    update_interval: 60s
    formula: "return a * 100.0f / 255.0f;"
    unit_of_measurement: "%"
    icon: "mdi:fuel"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Fuel Rate"
    mode: "01"
    pid: "5E"
    update_interval: 10s
    formula: "return ((a * 256.0f) + b) / 20.0f;"
    unit_of_measurement: "L/h"
    icon: "mdi:fuel"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR HV Battery SoC"
    mode: "01"
    pid: "5B"
    update_interval: 30s
    formula: "return a * 100.0f / 255.0f;"
    unit_of_measurement: "%"
    device_class: battery
    icon: "mdi:car-electric"
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR 12V Battery"
    mode: "01"
    pid: "42"
    update_interval: 30s
    formula: "return ((a * 256.0f) + b) / 1000.0f;"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    state_class: measurement

  - platform: ble_elm327
    ble_elm327_id: obd_elm
    name: "Toyota C-HR Distance Driven"
    mode: "01"
    pid: "31"
    update_interval: 30s
    formula: "return (a * 256.0f) + b;"
    unit_of_measurement: "km"
    icon: "mdi:map-marker-distance"
    state_class: total_increasing

  # ---------- Connectivity / sync health -------------------------------------
  - platform: wifi_signal
    name: "Toyota C-HR WiFi Signal"
    id: wifi_signal_db
    unit_of_measurement: "dBm"
    device_class: signal_strength
    update_interval: 30s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "Toyota C-HR WiFi Signal %"
    filters:
      - lambda: |-
          if (x <= -100.0) return 0.0;
          if (x >= -50.0) return 100.0;
          return 2.0 * (x + 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

  - platform: uptime
    name: "Toyota C-HR ESP32 Uptime"
    entity_category: diagnostic

# =============================================================================
#  DIAGNOSTIC: link health + "engine running" indicator
# =============================================================================
binary_sensor:
  - platform: status
    name: "Toyota C-HR Online"
    id: car_online

  # "In range" = the BLE client is connected to the dongle. Because the MAC is
  # entered at runtime from the HA UI, we track the ble_client connection state
  # rather than a fixed-MAC ble_presence scan.
  - platform: ble_client
    ble_client_id: obd_client
    name: "Toyota C-HR In Range"
    id: dongle_in_range

  - platform: template
    name: "Toyota C-HR Engine Running"
    id: engine_running
    device_class: running
    lambda: |-
      if (isnan(id(engine_rpm).state)) return false;
      return id(engine_rpm).state > 300;

  # DATA FRESH = a real PID (RPM) arrived within the last 30 s. Distinguishes
  # "BLE connected but silent" (car asleep / wrong UUIDs) from "data flowing".
  - platform: template
    name: "Toyota C-HR Data Fresh"
    id: data_fresh
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      if (id(last_data_ms) == 0) return false;
      return (millis() - id(last_data_ms)) < 30000;

text_sensor:
  - platform: template
    name: "Toyota C-HR Last Synced"
    id: last_synced
    icon: "mdi:cloud-sync"
    entity_category: diagnostic

  # ONE-LINE connectivity verdict so you know exactly where to troubleshoot.
  - platform: template
    name: "Toyota C-HR Connection Status"
    id: conn_status
    icon: "mdi:lan-connect"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      bool ble = id(obd_client).connected();
      bool fresh = (id(last_data_ms) != 0) && ((millis() - id(last_data_ms)) < 30000);
      if (!ble)   return {"BLE down - check dongle MAC / range / phone still paired"};
      if (!fresh) return {"BLE connected, no data - car asleep? wrong UUIDs/protocol?"};
      return {"All OK - data flowing end to end"};

# ---- Time source ------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
